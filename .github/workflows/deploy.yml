name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_retries:
        description: "Número máximo de tentativas na conversão de PDF (MD_TO_PDF_MAX_RETRIES)"
        required: false
        default: "3"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache build state (dist)
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            dist-${{ runner.os }}-${{ github.ref }}
            dist-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run build
        env:
          MD_TO_PDF_MAX_RETRIES: ${{ inputs.max_retries || '3' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
